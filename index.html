<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f9">
<title>HB Relevé</title>
<link rel="manifest" href="manifest.json">

<style>
/* ===== Présentation « à la Apple » : listes groupées, grands titres, segments, interrupteurs, barre translucide.
   Une seule teinte d'accent : le bronze du rabot Héritage Bois. ===== */
@font-face{font-family:'Inter';font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format('woff2')}
:root{--tint:#8c6d3f;--tint-fond:rgba(140,109,63,.12);--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.18);--fond:#f2f2f7;--carte:#fff;--champ:#f2f2f7;--rouge:#ff3b30;--orange:#ff9500;--vert:#34c759;--ok:#248a3d;
  --sans:'Inter',-apple-system,system-ui,Roboto,sans-serif;--r:12px;
  --encre:#000;--bois:var(--tint);--bois2:var(--tint);--txt:#000;--ia:var(--orange);--bleu:var(--tint);--ligne:var(--sep);--alerte:var(--rouge);--gris:var(--label2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fond);color:var(--label);font:17px/1.35 var(--sans);letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
header{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;padding:4px 8px;padding-top:max(4px,env(safe-area-inset-top));background:rgba(249,249,249,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
header h1{grid-column:2;grid-row:1;font:600 17px/1.2 var(--sans);margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
header .gauche{grid-column:1;grid-row:1;display:flex;align-items:center}
header .droite{grid-column:3;grid-row:1;display:flex;align-items:center;justify-content:flex-end;gap:6px}
header button{background:transparent;border:0;color:var(--tint);font:400 17px var(--sans);display:inline-flex;align-items:center;gap:2px;padding:8px 6px}
header .logo{display:none!important}
#reseau{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--label2);letter-spacing:0}
#reseau::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--label3)}
#reseau.on::before{background:var(--vert)}
main{padding:6px 16px 140px;max-width:760px;margin:0 auto}
.grand-titre{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 2px}
.grand-titre h2{font:700 34px/1.1 var(--sans);letter-spacing:-.025em;margin:0}
.grand-titre p{margin:2px 0 0;color:var(--label2);font-size:15px}
.grand-titre img{height:58px;opacity:.9}
.carte{position:relative;background:var(--carte);border-radius:var(--r);padding:12px 16px;margin:38px 0 0}
.carte h2{position:absolute;left:16px;right:16px;top:-27px;margin:0;font:400 13px/1.2 var(--sans);text-transform:uppercase;letter-spacing:.02em;color:var(--label2);display:flex;justify-content:space-between}
.carte h2 .muted{font-size:13px}
label.l{display:block;font-size:13px;font-weight:500;color:var(--label2);margin:14px 0 6px;letter-spacing:0}
.coche{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:12px;font-size:17px;margin:10px 0 2px;padding:6px 0;color:var(--label)}
.coche input[type=checkbox],.media input[type=checkbox]{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:#e9e9eb;position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0;padding:0;border:0}
.coche input[type=checkbox]::after,.media input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .2s}
.coche input:checked,.media input:checked{background:var(--vert)}
.coche input:checked::after,.media input:checked::after{transform:translateX(20px)}
input,textarea,select{width:100%;font:400 17px/1.3 var(--sans);padding:11px 12px;border:0;border-radius:10px;background:var(--champ);color:var(--label);letter-spacing:-.011em}
input::placeholder,textarea::placeholder{color:var(--label3)}
input:focus,textarea:focus{outline:2px solid var(--tint);outline-offset:0;background:#fff}
textarea{min-height:84px;resize:vertical}
input.cote{font:600 34px/1.1 var(--sans);text-align:center;letter-spacing:-.02em;padding:10px;font-variant-numeric:tabular-nums}
.ia-flag{box-shadow:0 0 0 2px var(--orange)!important;background:#fff7eb!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--champ);border-radius:18px;padding:9px 15px;font:500 15px/1.15 var(--sans);color:var(--label);min-height:38px;transition:transform .1s}
.chip.on{background:var(--tint);color:#fff}
.chip.ia{box-shadow:0 0 0 2px var(--orange)}
.chips.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips.g4 .chip{border-radius:10px;padding:12px 2px;text-align:center;min-height:46px;font-weight:600}
.chips.g2,.chips.g3{display:grid;gap:0;background:#e3e3e8;border-radius:10px;padding:2px}
.chips.g2{grid-template-columns:repeat(2,1fr)}
.chips.g3{grid-template-columns:repeat(3,1fr)}
.chips.g2 .chip,.chips.g3 .chip{background:transparent;border-radius:8px;padding:8px 4px;min-height:36px;text-align:center;font-size:14px;font-weight:500;color:var(--label)}
.chips.g2 .chip.on,.chips.g3 .chip.on{background:#fff;color:var(--label);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.chips.g2 .chip.ia,.chips.g3 .chip.ia{box-shadow:0 0 0 2px var(--orange)}
.ligne2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ligne3{display:grid;grid-template-columns:1fr;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:14px 16px;font:600 17px/1.1 var(--sans);letter-spacing:-.01em;background:var(--tint);color:#fff;min-height:50px;transition:transform .1s,opacity .1s}
.btn:active,.chip:active,.tb:active,.item:active{transform:scale(.97);opacity:.8}
.btn.sec{background:var(--tint-fond);color:var(--tint)}
.btn.vert{background:var(--vert)}
.btn.rouge{background:var(--rouge)}
.btn.bleu{background:var(--tint)}
.btn.ia{background:linear-gradient(100deg,#f5a623,#ff6b6b 45%,#b86bff);color:#fff}
.btn.plein{width:100%}
.btn:disabled{opacity:.35}
.barre{display:flex;gap:10px;flex-wrap:wrap}
.barre .btn{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:.5px solid var(--sep);background:transparent;margin:0;cursor:pointer}
.item:last-of-type{border-bottom:0}
.item::after{content:'';width:8px;height:8px;border-right:2px solid var(--label3);border-top:2px solid var(--label3);transform:rotate(45deg);flex:none;margin:0 4px 0 2px}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;font-size:17px}
.item .t small{color:var(--label2);font-size:15px}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
.badge.ok{background:#e3f6e7;color:var(--ok)}
.badge.enc{background:#fff1dc;color:#c46c00}
.badge.env{background:var(--tint-fond);color:var(--tint)}
.alertes{margin:0;padding:0;list-style:none}
.alertes li{background:#ffefee;color:#d70015;border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:15px}
.alertes li.info{background:var(--champ);color:var(--label2)}
.medias{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.media{border-radius:var(--r);overflow:hidden;background:var(--champ);font-size:14px}
.media img,.media video{width:100%;height:120px;object-fit:cover;display:block;background:#222}
.media audio{width:100%}
.media .c{padding:8px 10px}
.media label{display:flex;flex-direction:row-reverse;justify-content:space-between;gap:6px;align-items:center;font-size:13px}
.media input[type=checkbox]{transform:scale(.8);transform-origin:right center}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(249,249,249,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);max-width:none;margin:0}
.fab .btn{flex:1;min-height:46px;margin:2px 4px;font-size:16px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:0;color:var(--tint);font:500 11px/1 var(--sans);padding:6px 2px;max-width:120px}
.tb svg.i{width:26px;height:26px}
.tb.principal span.rond{width:50px;height:50px;border-radius:50%;background:var(--tint);color:#fff;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 4px 12px rgba(140,109,63,.35)}
.tb.principal.rec-on span.rond{background:var(--rouge);box-shadow:0 4px 12px rgba(255,59,48,.4);animation:pulse 1.2s infinite}
.tb.principal.rec-on{color:var(--rouge)}
.rec{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.muted{color:var(--label2);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(40,40,40,.86);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;padding:12px 18px;border-radius:14px;z-index:40;font-size:15px;font-weight:500;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:500;color:var(--tint);padding:8px 0}
.prop{border-radius:var(--r);padding:12px 14px;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(100deg,#f5a623,#ff6b6b 45%,#b86bff) border-box;border:2px solid transparent;margin-top:12px}
.prop label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.progress{height:6px;border-radius:3px;background:#e3e3e8;overflow:hidden}
.progress div{height:100%;background:var(--tint);width:0;border-radius:3px}
.step{display:grid;grid-template-columns:1fr auto 64px auto;gap:10px;align-items:center;margin-top:8px}
.step button{width:44px;height:36px;font-size:22px;border-radius:9px;border:0;background:#e3e3e8;color:var(--label)}
.step input{text-align:center;font-size:20px;font-weight:600;min-width:0;padding:6px}
.aide{color:var(--label2);font-size:13px;margin:6px 0 0}
a{color:var(--tint);text-decoration:none}
.cartouche{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:var(--r);margin:12px 0 0;overflow:hidden}
.cartouche div{padding:10px 16px;border-bottom:.5px solid var(--sep);min-width:0}
.cartouche div.large{grid-column:1/-1}
.cartouche div:nth-last-child(-n+2){border-bottom:0}
.cartouche small{display:block;font-size:12px;font-weight:500;color:var(--label2)}
.cartouche b{display:block;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cartouche div.large b{font-size:22px;letter-spacing:-.02em}
/* appareil photo intégré */
#recbar{position:fixed;left:50%;transform:translateX(-50%);width:min(92vw,520px);top:calc(58px + env(safe-area-inset-top));z-index:30;background:rgba(20,20,20,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#recbar b{display:inline-flex;align-items:center;gap:7px;font-weight:600}
#recbar b::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--rouge);animation:pulse 1.2s infinite}
#recbar #recT{float:right;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.7)}
#recbar #recTxt{font-size:15px;margin:6px 0 4px;max-height:4.5em;overflow:hidden;color:rgba(255,255,255,.92)}
#recbar small{color:rgba(255,255,255,.55);font-size:12px}
#cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:contain;min-height:0;background:#000;touch-action:none}
#cam .zoom{position:absolute;left:0;right:0;bottom:150px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 20px}
#cam .zoom .presets{display:flex;gap:10px}
#cam .zoom .presets button{min-width:48px;height:48px;border-radius:24px;border:0;background:rgba(0,0,0,.55);color:#fff;font:inherit;font-weight:700;font-size:15px}
#cam .zoom .presets button.on{background:#fff;color:#000}
#cam .zoom input[type=range]{width:100%;max-width:420px;accent-color:#fff;border:0;background:transparent;padding:0}
#cam .lens{width:56px;height:56px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
#cam .haut{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#cam .haut button{background:rgba(60,60,60,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;border:0;border-radius:20px;padding:10px 16px;font:500 15px var(--sans)}
#cam .bas{display:flex;justify-content:space-around;align-items:center;padding:18px 10px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:#000}
#cam .declic{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
#cam .rec{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#ff3b30;color:#fff;font-weight:700}
#cam .rec.on{border-radius:14px;animation:pulse 1s infinite}
#cam .lib{color:#fff;font-size:13px;text-align:center;width:70px}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#cam .chrono{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#d32f2f;color:#fff;padding:4px 12px;border-radius:12px;font-weight:700}

details.pli{padding:0;margin-top:10px}
details.pli>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer}
details.pli>summary::-webkit-details-marker{display:none}
details.pli>summary .tt{flex:1;min-width:0}
details.pli>summary b{display:block;font-size:17px;font-weight:500;color:var(--label);letter-spacing:-.011em}
details.pli>summary small{display:block;color:var(--label2);font-size:15px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.pli>summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--label3);border-top:2px solid var(--label3);transform:rotate(135deg);transition:transform .2s;margin:0 4px}
details.pli[open]>summary::after{transform:rotate(-45deg)}
details.pli>.contenu{padding:0 16px 16px;border-top:.5px solid var(--sep)}
details.pli .carte{padding:0;margin:0;background:transparent}
details.pli .carte h2{display:none}
</style>
</head>

<header>
  <div class="gauche"><button id="retour" aria-label="Retour" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Retour</button></div>

<main id="app"></main>

<script>
'use strict';
/* =====================================================================
   HB Relevé — Héritage Bois — relevé de chantier hors ligne
   Version 0.1 (17/11/2026). Données stockées sur le téléphone (IndexedDB).
   ===================================================================== */
const VERSION = '0.9';

const FORMAT = 'hb-releve-1';

/* ---------- Icônes (traits fins, façon SF Symbols) ---------- */
const ic = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I = {
  micro: ic('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
  stop: ic('<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/>'),
  photo: ic('<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>'),
  fini: ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  suivant: ic('<path d="M5 12h14M13 6l6 6-6 6"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  lieu: ic('<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
  ia: ic('<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>'),
  envoyer: ic('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 14v5h14v-5"/>'),
  galerie: ic('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>'),
};

/* ---------- Listes (vocabulaire Térence, Synthèse § 2) ---------- */
const TYPES = ['OF1','OF2','OF3','OF4','PF1','PF2','PF3','Fixe','Porte 1V','Porte 2V','Volet 1V','Volet 2V','Volet 4V','Autre'];
const REFS = ['Hors-tout','Tableau','Dos de dormant'];
const NATURES = ['Fenêtres','Portes-fenêtres','Portes','Volets','Restauration'];
const GAMMES = ['Recouvrement 58','Affleurante 58, paumelles semi-encastrées','Affleurante 58, paumelles non encastrées','À définir'];
const FINITIONS = ['Pré-peinture blanche','Peinture de finition','Lasure','Brut','Variante'];
const ESSENCES = ['Chêne','Pin','Mélèze','Sapelli','Moabi','À définir'];
const VITRAGES = ['STD 4/18/4','44.2','SP10','Sans','À définir'];
const POSES = ['Fourniture + pose','Fourniture seule'];
const FIXES = ['Aucun','Gauche','Droite','Gauche + droite'];
const FORMES = ['Droite','Cintrée'];
const CINTRES = ['Arc tendu','Plein cintre','Anse de panier'];
const SENS_1V = ['Tirant gauche','Tirant droit'];
const SENS_2V = ['VP à droite','VP à gauche'];
const BAS = ['Pièce d’appui','Seuil alu'];

/* ---------- Petits outils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const auj = () => new Date().toISOString().slice(0,10);
const getP = (o,p) => p.split('.').reduce((a,k)=>a==null?a:a[k], o);
const setP = (o,p,v) => { const k=p.split('.'); let a=o; k.slice(0,-1).forEach(x=>{ if(a[x]==null||typeof a[x]!=='object') a[x]={}; a=a[x]; }); a[k[k.length-1]]=v; };
const slug = s => (s||'SANS NOM').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'_').toUpperCase().slice(0,40) || 'SANS_NOM';
function toast(m, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- Base locale (IndexedDB) ---------- */
let DB;
function ouvrirDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('hb-releve', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('dossiers', {keyPath:'id'});
      d.createObjectStore('ouvertures', {keyPath:'id'}).createIndex('dossierId','dossierId');
      d.createObjectStore('medias', {keyPath:'id'}).createIndex('dossierId','dossierId');
      d.createObjectStore('reglages', {keyPath:'k'});
    };
    r.onsuccess = () => { DB = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = DB.transaction(store, mode); const s = t.objectStore(store);
    let out; const r = fn(s); if (r) r.onsuccess = () => out = r.result;
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbGet = (s, k) => tx(s, 'readonly', st => st.get(k));
const dbDel = (s, k) => tx(s, 'readwrite', st => st.delete(k));
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbParDossier = (s, id) => tx(s, 'readonly', st => st.index('dossierId').getAll(id));

/* ---------- Géolocalisation du chantier ---------- */
const ATELIER = { lat:43.8547, lon:4.6273 };   // Vallabrègues, approximatif (H) : rien n'est enregistré à moins de 500 m de l'atelier
function distanceKm(a, b){ const R6=6371, t=x=>x*Math.PI/180, dLa=t(b.lat-a.lat), dLo=t(b.lon-a.lon);
  const h = Math.sin(dLa/2)**2 + Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2; return 2*R6*Math.asin(Math.sqrt(h)); }
function position(){ return new Promise((res, rej) => { if (!navigator.geolocation) return rej(new Error('indisponible'));
  navigator.geolocation.getCurrentPosition(p => res({lat:p.coords.latitude, lon:p.coords.longitude, precision:Math.round(p.coords.accuracy)}), rej, {enableHighAccuracy:true, timeout:15000, maximumAge:60000}); }); }
async function geolocaliser(dossier, manuel=false){
  try {
    const p = await position();
    if (!manuel && distanceKm(p, ATELIER) < 0.5) return;            // à l'atelier : on n'enregistre pas
    dossier.geo = Object.assign(p, {date:new Date().toISOString()}); dossier.maj = new Date().toISOString();
    await dbPut('dossiers', dossier); if (D && D.id === dossier.id) D.geo = dossier.geo;
    if (manuel) { toast('📍 Chantier localisé'); rafraichir(); }
  } catch (e) { if (manuel) toast('Localisation impossible : activez la position du téléphone'); }
}
const lienMaps = g => `https://www.google.com/maps?q=${g.lat},${g.lon}`;

/* ---------- Contrôles de cohérence (alertent, ne bloquent jamais) ---------- */
function controles(o){
  const a = [];
  const L = +o.L, H = +o.H, t = o.type || '';
  if (!t) a.push(['err','Type d’ouvrage non choisi']);
  if (!o.L) a.push(['err','Largeur manquante']); else if (!o.Lref) a.push(['err','Largeur : choisir hors-tout, tableau ou dos de dormant']);
  if (!o.H) a.push(['err','Hauteur manquante']); else if (!o.Href) a.push(['err','Hauteur : choisir hors-tout, tableau ou dos de dormant']);
  if (o.L && (L < 150 || L > 5000)) a.push(['err',`Largeur ${L} mm : hors plage habituelle, vérifier (mm ?)`]);
  if (o.H && (H < 150 || H > 5000)) a.push(['err',`Hauteur ${H} mm : hors plage habituelle, vérifier (mm ?)`]);
  if (/^PF/.test(t) && H && H < 1800) a.push(['info',`PF de ${H} de haut : vérifier (fenêtre ?)`]);
  if (/^OF/.test(t) && H && H > 2300) a.push(['info',`OF de ${H} de haut : vérifier (porte-fenêtre ?)`]);
  if (/^(OF|PF)/.test(t) && L && H && L > H*1.8) a.push(['info','Largeur bien plus grande que la hauteur : cotes inversées ?']);
  if (/^(OF2|PF2)/.test(t) && L && L < 700) a.push(['info',`${t} de ${L} de large : vantaux très étroits, vérifier`]);
  if (o.forme === 'Cintrée') {
    if (!o.cintre.fleche) a.push(['err','Cintrée : flèche manquante']);
    else if (!o.cintre.flecheRef) a.push(['err','Flèche : préciser tableau ou hors-tout']);
    if (o.cintre.type === 'Plein cintre' && o.cintre.fleche && L && Math.abs(+o.cintre.fleche - L/2) > 30) a.push(['info','Plein cintre : flèche ≠ demi-largeur, vérifier']);
    if (o.cintre.fleche && H && +o.cintre.fleche >= H) a.push(['err','Flèche ≥ hauteur : impossible']);
  }
  if (o.soubassement) {
    if (!o.soubH) a.push(['err','Soubassement : hauteur manquante']);
    else if (H && +o.soubH >= H) a.push(['err','Soubassement ≥ hauteur : impossible']);
    else if (+o.soubH < 200 || (H && +o.soubH > H*0.7)) a.push(['info',`Soubassement ${o.soubH} mm : vérifier`]);
  }
  if (o.Lref && o.Href && o.Lref !== o.Href) a.push(['info',`Largeur en ${o.Lref.toLowerCase()}, hauteur en ${o.Href.toLowerCase()} : voulu ?`]);
  if (o.iaChamps && o.iaChamps.length) a.push(['info',`${o.iaChamps.length} case(s) remplie(s) par l’IA à vérifier (en orange)`]);
  return a;
}

function chips(path, options, cible, multi=false, grille=''){
  const v = getP(cible, path);
  const ia = (cible.iaChamps||[]).includes(path);
  return `<div class="chips ${grille}">${options.map(x => {
    const on = multi ? (v||[]).includes(x) : v === x;
    return `<button class="chip${on?' on':''}${on&&ia?' ia':''}" data-chip="${esc(path)}" data-v="${esc(x)}" data-multi="${multi?1:0}">${esc(x)}</button>`;
  }).join('')}</div>`;
}
function champ(path, cible, opts={}){
  const v = getP(cible, path) ?? '';
  const ia = (cible.iaChamps||[]).includes(path) ? ' ia-flag' : '';
  if (opts.zone) return `<textarea data-f="${path}" class="${ia}" placeholder="${esc(opts.ph||'')}">${esc(v)}</textarea>`;
  const num = opts.num ? ' inputmode="numeric" pattern="[0-9]*"' : '';
  return `<input data-f="${path}" class="${opts.cote?'cote':''}${ia}" value="${esc(v)}" placeholder="${esc(opts.ph||'')}"${num} type="${opts.type||'text'}" autocomplete="off">`;
}
function cible(el){ return el.closest('[data-cible="d"]') ? D : O; }

document.addEventListener('input', e => {
  const el = e.target; const p = el.dataset.f; if (!p) return;
  const c = cible(el); if (!c) return;
  let v = el.value;
  if (el.inputMode === 'numeric') { v = v.replace(/[^0-9]/g,''); if (v !== el.value) el.value = v; }
  setP(c, p, v);
  c.iaChamps = (c.iaChamps||[]).filter(x => x !== p); el.classList.remove('ia-flag');
  if (c === O && (p === 'carH' || p === 'carL') && v) O.grandJour = false;
  if (c === O && (p === 'carH' || p === 'carL') && v) { const autre = p === 'carH' ? 'carL' : 'carH'; if (!O[autre]) { O[autre] = '1'; const e2 = document.querySelector(`[data-f="${autre}"]`); if (e2) e2.value = '1'; } }
  if (c === O && O.statut === 'validée') { O.statut = 'modifiée'; }
  sauver();
  if (c === O && el.dataset.live) majControles();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-chip]'); if (!b) return;
  const c = cible(b); if (!c) return;
  const p = b.dataset.chip, v = b.dataset.v;
  if (b.dataset.multi === '1') { const arr = getP(c,p) || []; setP(c, p, arr.includes(v) ? arr.filter(x=>x!==v) : [...arr, v]); }
  else setP(c, p, getP(c,p) === v ? '' : v);
  c.iaChamps = (c.iaChamps||[]).filter(x => x !== p);
  if (c === O && O.statut === 'validée') O.statut = 'modifiée';
  sauver();
  const y = window.scrollY; (c === O ? vueOuverture() : vueDossier()); window.scrollTo(0, y);
});

async function enregistrerMedia(blob, kind, nom, extra={}){
  const m = Object.assign({ id:uid(), dossierId:D.id, ouvertureId:mediaCible, kind, mime:blob.type || (kind==='photo'?'image/jpeg':kind==='audio'?'audio/webm':'video/webm'), blob, nom, date:new Date().toISOString(), transcrire: kind==='audio', note:'', envoye:false }, extra);
  await dbPut('medias', m); MEDIAS.push(m); return m;
}
/* Appareil photo intégré : s'ouvre directement, focale 1 par défaut, zoom réglable, choix de l'objectif */
let CAM = null;
const gUM = c => navigator.mediaDevices.getUserMedia(c);
async function fluxCamera(deviceId){
  const base = deviceId ? { deviceId:{exact:deviceId} } : { facingMode:{ideal:'environment'} };
  // 4:3 = plein capteur (le 16:9 recadre et « zoome ») ; zoom:true demande le contrôle du zoom
  const v = Object.assign({}, base, { width:{ideal:1920}, height:{ideal:1440}, aspectRatio:{ideal:4/3}, zoom:true });
  const essais = [ {video:v, audio:true}, {video:v}, {video:Object.assign({}, base, {width:{ideal:1920}, height:{ideal:1440}}), audio:true}, {video:base} ];
  let err; for (const c of essais) { try { return await gUM(c); } catch (e) { err = e; if (e.name === 'NotAllowedError') break; } }
  throw err;
}
async function camerasArriere(){
  try { const ds = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    const arr = ds.filter(d => /back|arri[eè]re|rear|environment/i.test(d.label)); return arr.length ? arr : ds; } catch(_) { return []; }
}
async function ouvrirCamera(ouvertureId){
  mediaCible = ouvertureId;
  const repli = () => { $('#capture').setAttribute('accept','image/*'); $('#capture').value=''; $('#capture').click(); };
  if (!navigator.mediaDevices?.getUserMedia) return repli();
  let stream;
  try { stream = await fluxCamera(lsGet('hb-cam-device', '') || null); }
  catch (e) { try { lsSet('hb-cam-device',''); stream = await fluxCamera(null); } catch (e2) { toast('Appareil photo refusé : autorisez-le dans Chrome'); return repli(); } }
  const el = document.createElement('div'); el.id = 'cam';
  el.innerHTML = `<video autoplay playsinline muted></video><div class="flash"></div>
    <div class="haut"><button id="camFermer">✕ Fermer</button><span id="camNb"></span><button id="camTele">Télémètre</button></div>
    <div class="zoom" hidden><div class="presets"></div><input type="range" id="camZoom"></div>
    <div class="bas"><div class="lib"><button class="rec" id="camRec" aria-label="Vidéo"></button><br>Vidéo</div>
      <div class="lib"><button class="declic" id="camPhoto" aria-label="Photo"></button><br>Photo</div>
      <div class="lib"><button class="lens" id="camLens" aria-label="Objectif" hidden>⟳</button><br><span id="camLensTxt"></span></div></div>`;
  document.body.appendChild(el);
  const v = el.querySelector('video');
  CAM = { el, stream, n:0, rec:null, chunks:[], t0:0, timer:null, zoom:null, backs:[] };
  const nb = () => el.querySelector('#camNb').textContent = CAM.n ? `${CAM.n} enregistré(s)` : '';
  const track = () => CAM.stream.getVideoTracks()[0];

  async function regler(z){
    if (!CAM.zoom) return;
    const {min, max, step} = CAM.zoom; z = Math.min(max, Math.max(min, Math.round(z/(step||0.1))*(step||0.1)));
    try { await track().applyConstraints({advanced:[{zoom:z}]}); } catch(_) {}
    CAM.z = z; el.querySelector('#camZoom').value = z;
    el.querySelectorAll('.presets button').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.z - z) < 0.05));
  }
  async function brancherFlux(){
    v.srcObject = CAM.stream;
    const t = track(); const caps = t.getCapabilities ? t.getCapabilities() : {};
    const zb = el.querySelector('.zoom');
    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      CAM.zoom = caps.zoom; const r = el.querySelector('#camZoom');
      r.min = caps.zoom.min; r.max = caps.zoom.max; r.step = caps.zoom.step || 0.1;
      const pres = [...new Set([caps.zoom.min < 0.95 ? Math.round(caps.zoom.min*10)/10 : null, 1, caps.zoom.max >= 2 ? 2 : null, caps.zoom.max >= 5 ? 5 : null].filter(x => x != null && x >= caps.zoom.min && x <= caps.zoom.max))];
      zb.querySelector('.presets').innerHTML = pres.map(z => `<button data-z="${z}">${String(z).replace('.',',')}×</button>`).join('');
      zb.querySelectorAll('.presets button').forEach(b => b.onclick = () => regler(+b.dataset.z));
      r.oninput = () => regler(+r.value);
      zb.hidden = false;
      await regler(Math.min(caps.zoom.max, Math.max(caps.zoom.min, 1)));   // toujours focale 1 à l'ouverture
    } else { CAM.zoom = null; zb.hidden = true; }
    CAM.backs = await camerasArriere();
    const lb = el.querySelector('#camLens');
    if (CAM.backs.length > 1) {
      lb.hidden = false;
      const id = t.getSettings ? t.getSettings().deviceId : '';
      const i = Math.max(0, CAM.backs.findIndex(d => d.deviceId === id));
      el.querySelector('#camLensTxt').textContent = `Objectif ${i+1}/${CAM.backs.length}`;
    }
  }
  await brancherFlux();

  // pincer pour zoomer
  let pinch = null;
  v.addEventListener('touchstart', e => { if (e.touches.length === 2 && CAM.zoom) { const [a,b] = e.touches; pinch = { d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z: CAM.z || 1 }; } }, {passive:true});
  v.addEventListener('touchmove', e => { if (pinch && e.touches.length === 2) { const [a,b] = e.touches; const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); regler(pinch.z * d / pinch.d); } }, {passive:true});
  v.addEventListener('touchend', () => pinch = null, {passive:true});

  el.querySelector('#camLens').onclick = async () => {
    if (CAM.rec) return toast('Arrêtez la vidéo avant de changer d’objectif');
    const id = track().getSettings ? track().getSettings().deviceId : '';
    const i = CAM.backs.findIndex(d => d.deviceId === id);
    const suiv = CAM.backs[(i + 1) % CAM.backs.length];
    try {
      CAM.stream.getTracks().forEach(t => t.stop());
      CAM.stream = await fluxCamera(suiv.deviceId); lsSet('hb-cam-device', suiv.deviceId); await brancherFlux();
    } catch (e) { toast('Objectif indisponible'); lsSet('hb-cam-device',''); CAM.stream = await fluxCamera(null); await brancherFlux(); }
  };
  el.querySelector('#camFermer').onclick = () => fermerCamera(true);
  el.querySelector('#camTele').onclick = e => { CAM.tele = !CAM.tele; e.target.textContent = CAM.tele ? 'Télémètre ✓' : 'Télémètre'; e.target.style.background = CAM.tele ? '#ff9500' : ''; };
  el.querySelector('#camPhoto').onclick = async () => {
    try {
      let blob = null;
      if ('ImageCapture' in window) { try { blob = await new ImageCapture(track()).takePhoto(); } catch(_){} }
      if (!blob) { const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v,0,0); blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92)); }
      const f = el.querySelector('.flash'); f.style.opacity = .9; setTimeout(() => f.style.opacity = 0, 120);
      await enregistrerMedia(blob, 'photo', CAM.tele ? 'telemetre' : 'photo', {telemetre: !!CAM.tele}); CAM.n++; nb();
    } catch (e) { toast('Photo impossible : ' + e.message); }
  };
  el.querySelector('#camRec').onclick = () => {
    const b = el.querySelector('#camRec');
    if (CAM.rec) { CAM.rec.stop(); return; }
    const types = ['video/mp4','video/webm;codecs=vp9,opus','video/webm'];
    const mt = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    CAM.chunks = []; CAM.rec = new MediaRecorder(CAM.stream, mt ? {mimeType: mt} : undefined);
    CAM.rec.ondataavailable = e => e.data.size && CAM.chunks.push(e.data);
    CAM.rec.onstop = async () => {
      clearInterval(CAM.timer); el.querySelector('.chrono')?.remove(); b.classList.remove('on');
      const blob = new Blob(CAM.chunks, {type: (CAM.chunks[0] && CAM.chunks[0].type) || mt || 'video/webm'}); CAM.rec = null;
      if (blob.size) { await enregistrerMedia(blob, 'video', 'video'); CAM.n++; nb(); }
      if (CAM._fermer) fermerCamera(true);
    };
    CAM.rec.start(1000); CAM.t0 = Date.now(); b.classList.add('on');
    const ch = document.createElement('div'); ch.className = 'chrono'; el.appendChild(ch);
    CAM.timer = setInterval(() => { const s = Math.round((Date.now()-CAM.t0)/1000); ch.textContent = `● ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }, 300);
  };
}
function fermerCamera(rafraichirVue){
  if (!CAM) return;
  if (CAM.rec && CAM.rec.state !== 'inactive') { CAM._fermer = true; CAM.rec.stop(); return; }
  CAM.stream.getTracks().forEach(t => t.stop()); CAM.el.remove();
  const n = CAM.n; CAM = null;
  if (n) toast(`${n} média(s) ajouté(s)`);
  if (rafraichirVue) rafraichir();
}

let rec = null, recChunks = [], recDebut = 0, recTimer = null, recCible = null;

const SYSTEME = `Tu aides Térence, menuisier (Héritage Bois), à remplir une fiche de relevé de chantier à partir de sa dictée (reconnaissance vocale, parfois bruitée).
Règles :

- Carreaux par vantail : si seul le nombre EN HAUTEUR est dit, carL = 1 ; si seul le nombre EN LARGEUR est dit, carH = 1 (ex. fixe 2000 × 500 avec "6 carreaux sur la largeur" → carH 1, carL 6). Si les deux sont dits, mets les deux (ex. "8 carreaux, 4 en hauteur et 2 en largeur" → 4 et 2). Si seul un total est dit sans répartition, ne remplis pas et signale-le dans "doutes".
- Valeurs par défaut (déjà dans la fiche, ne les change que si la dictée dit autre chose) : cotes en Hors-tout (largeur, hauteur, flèche, pied droit) ; cintre non précisé = "Arc tendu" ; aucun carreau dit = grandJour true. Si des carreaux sont dits : grandJour false.
- Répartition de carreaux différente entre VP et VS, dans un fixe adossé ou dans une imposte (imposte dans le cadre ou imposte avec faux ouvrants) : mets la répartition principale dans carH/carL et décris le reste dans "notes".

- Types de pose (vocabulaire) : dépose totale ; rénovation avec conservation des dormants existants ; pose en applique sans tapée ; pose en applique avec tapée (= avec rattrapage de doublage, c'est la même chose) ; pose en feuillure ; pose en embrasure ; pose en tunnel.
- Erreurs fréquentes de la reconnaissance vocale : "A Florente", "à Florente", "affleurente" = affleurante ; "impression blanche" = pré-peinture blanche ; "pause" = pose ; "des pauses totales" = dépose totale ; "fure", "feur" = feuillure ; "taper" = tapée ; "ventail" = vantail ; "lance de panier" = anse de panier.

Des photos de l'écran du télémètre de Térence peuvent être jointes : lis chaque valeur affichée (convertis en mm) et compare-la aux cotes dictées. Ne remplis pas une cote avec le télémètre seul : signale-le dans "doutes".

      body: JSON.stringify({ model: REG.modeleIA, max_tokens: 1500, system: SYSTEME, messages:[{role:'user', content: [
        ...(await Promise.all(teles.slice(0,4).map(async m => ({type:'image', source:{type:'base64', media_type:'image/jpeg', data: await imgB64(m.blob)}})))),
        {type:'text', text: msg + (teles.length ? `\n\n${Math.min(teles.length,4)} photo(s) de l'écran du télémètre jointe(s).` : '')} ]}] }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
    const txt = (j.content||[]).map(x=>x.text||'').join('');

async function imgB64(blob, max=1280){
  const bmp = await createImageBitmap(blob); const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width*r); cv.height = Math.round(bmp.height*r);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const b = await new Promise(res => cv.toBlob(res, 'image/jpeg', 0.85)); const u = new Uint8Array(await b.arrayBuffer());
  let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s);
}

/* L'IA remplit directement (cases en orange) ; « Annuler » remet la fiche comme avant */
async function proposerIA(k, res){
  const c = k === 'd' ? D : O;
  const avant = JSON.parse(JSON.stringify(c));
  const ch = res.champs || {}; const faits = [];
  for (const [p, v0] of Object.entries(ch)) {
    let v = v0; if (typeof v === 'number') v = String(v);
    if (['imposte','grandJour','soubassement'].includes(p)) v = v === true || v === 'true' || v === 'oui';
    if (p === 'notes') { if (!v) continue; if ((c.notes||'').includes(v)) continue; v = (c.notes ? c.notes + '\n' : '') + v; }
    if (JSON.stringify(getP(c, p)) === JSON.stringify(v)) continue;
    setP(c, p, v); faits.push(p);
    if (p !== 'notes') c.iaChamps = [...new Set([...(c.iaChamps||[]), p])];
    if (p.startsWith('criteres.') && c.criteres) c.criteres.idem = false;
  }
  if (c === O) {
    if ((faits.includes('carH') || faits.includes('carL')) && !faits.includes('grandJour')) c.grandJour = false;
    if ((c.carH || c.carL) && !(c.carH && c.carL)) { const autre = c.carH ? 'carL' : 'carH'; c[autre] = '1'; c.iaChamps = [...new Set([...(c.iaChamps||[]), autre])]; }
    if (c.grandJour) { c.carH = ''; c.carL = ''; }
    if (faits.length && O.statut === 'validée') O.statut = 'modifiée';
  }
  await sauverMaintenant(); rafraichir();
  const zone = $('#propIA'); if (!zone) return;
  const val = p => { const v = getP(c, p); return Array.isArray(v) ? v.join(', ') : v === true ? 'oui' : v === false ? 'non' : v; };
  zone.innerHTML = `<div class="prop"><b>${faits.length ? `L’IA a rempli ${faits.length} case(s) — vérifiez l’orange` : 'Rien de nouveau à remplir'}</b>
    ${faits.filter(p=>p!=='notes').map(p => `<div>• ${esc(NOMS(p))} : <b>${esc(val(p))}</b></div>`).join('')}${faits.includes('notes') ? '<div>• Notes complétées</div>' : ''}
    ${(res.telemetre||[]).length ? `<div style="margin-top:6px"><b>Télémètre</b>${res.telemetre.map(t => `<div>• ${esc(t)}</div>`).join('')}</div>` : ''}
    ${doutesHTML(res)}
    ${faits.length ? '<button class="btn sec plein" id="annIA" style="margin-top:8px">Annuler ces changements</button>' : ''}</div>`;
  if ($('#annIA')) $('#annIA').onclick = async () => { Object.keys(c).forEach(x => delete c[x]); Object.assign(c, avant); await sauverMaintenant(); rafraichir(); toast('Changements annulés'); };
  zone.scrollIntoView({block:'nearest'});
}

    if (o.forme==='Cintrée') L.push(`- Flèche : ${o.cintre.fleche||'?'} (${o.cintre.flecheRef||'réf. ?'}) · Pied droit : ${o.cintre.piedDroit||'—'} (${o.cintre.piedDroitRef||'—'})`);
    if (!/^Volet/.test(o.type)) L.push(`- Carreaux par vantail : ${o.grandJour?'grand jour':`H${o.carH||'?'} × L${o.carL||'?'}`}`);
    if (o.soubassement) L.push(`- Soubassement : ${o.soubH||'?'} mm, du bas de la menuiserie (dessous ${o.bas?o.bas.toLowerCase():'pièce d’appui / seuil ?'}) au dessus de la traverse intermédiaire (début du clair de vitrage)`);
    if (o.sens) L.push(`- Sens : ${o.sens}`);
    L.push(`- Critères : ${o.criteres.idem?'comme le dossier':[o.criteres.gamme,o.criteres.essence,o.criteres.finition,o.criteres.vitrage].filter(Boolean).join(' · ')}`);
    if (o.notes) L.push(`- Remarques : ${o.notes.replace(/\n/g,' / ')}`);
    if (o.dictee) L.push(`> Dictée : ${o.dictee.replace(/\n/g,' ')}`);
    if (o.iaChamps?.length) L.push(`- ⚠ Cases remplies par l’IA non vérifiées : ${o.iaChamps.join(', ')}`);
    const c = controles(o); if (c.length) L.push(`- Contrôles : ${c.map(x=>x[1]).join(' ; ')}`);
    const ms = MEDIAS.filter(m=>m.ouvertureId===o.id); if (ms.length) L.push(`- Médias : ${ms.map(m=>noms.get(m.id)).join(', ')}`);
  });
  return { json, md: L.join('\n'), noms };
}

/* =================== Dropbox (envoi direct) =================== */
const enc = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u' + ('000' + c.charCodeAt(0).toString(16)).slice(-4));
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
const redirectURI = () => location.origin + location.pathname;
async function connecterDropbox(){
  if (!REG.dbxAppKey) return toast('Saisir d’abord la clé d’application Dropbox');
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  lsSet('hb-pkce', v);
  location.href = `https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(REG.dbxAppKey)}&response_type=code&code_challenge=${ch}&code_challenge_method=S256&token_access_type=offline&redirect_uri=${encodeURIComponent(redirectURI())}`;
}
async function retourDropbox(){
  const q = new URLSearchParams(location.search); const code = q.get('code'); if (!code) return;
  history.replaceState(null, '', location.pathname + '#/reglages');
  try {
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body: new URLSearchParams({ code, grant_type:'authorization_code', code_verifier: lsGet('hb-pkce',''), client_id: REG.dbxAppKey, redirect_uri: redirectURI() }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error_description || j.error);
    await reg('dbxRefresh', j.refresh_token); await reg('dbxAccess', j.access_token); await reg('dbxExpire', Date.now() + (j.expires_in-60)*1000);
    toast('Dropbox connecté');
  } catch (e) { toast('Dropbox : ' + e.message, 5000); }
}
async function jetonDbx(){
  if (REG.dbxAccess && Date.now() < REG.dbxExpire) return REG.dbxAccess;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body: new URLSearchParams({ grant_type:'refresh_token', refresh_token: REG.dbxRefresh, client_id: REG.dbxAppKey }) });
  const j = await r.json(); if (!r.ok) throw new Error('reconnexion Dropbox nécessaire (' + (j.error_description||j.error) + ')');
  await reg('dbxAccess', j.access_token); await reg('dbxExpire', Date.now() + (j.expires_in-60)*1000); return j.access_token;
}
async function dbxRPC(route, arg){
  const r = await fetch('https://api.dropboxapi.com/2/' + route, { method:'POST', headers:{ Authorization:'Bearer ' + await jetonDbx(), 'Content-Type':'application/json' }, body: JSON.stringify(arg) });
  const t = await r.text(); if (!r.ok) throw new Error(route + ' : ' + t.slice(0,200)); return JSON.parse(t);
}
async function dbxUpload(path, blob, prog){
  const tok = await jetonDbx(); const CH = 8*1024*1024;
  const arg = { path, mode:'add', autorename:true, mute:true };
  if (blob.size <= CH) {
    const r = await fetch('https://content.dropboxapi.com/2/files/upload', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc(arg) }, body: blob });
    const t = await r.text(); if (!r.ok) throw new Error('envoi ' + path + ' : ' + t.slice(0,200)); prog && prog(blob.size); return JSON.parse(t);
  }
  let r = await fetch('https://content.dropboxapi.com/2/files/upload_session/start', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc({close:false}) }, body: blob.slice(0, CH) });
  let t = await r.text(); if (!r.ok) throw new Error('envoi (début) : ' + t.slice(0,200));
  const sid = JSON.parse(t).session_id; let off = CH; prog && prog(CH);
  while (blob.size - off > CH) {
    r = await fetch('https://content.dropboxapi.com/2/files/upload_session/append_v2', { method:'POST', headers:{ Authorization:'Bearer '+await jetonDbx(), 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc({cursor:{session_id:sid, offset:off}, close:false}) }, body: blob.slice(off, off+CH) });
    if (!r.ok) throw new Error('envoi (suite) : ' + (await r.text()).slice(0,200)); off += CH; prog && prog(CH);
  }
  r = await fetch('https://content.dropboxapi.com/2/files/upload_session/finish', { method:'POST', headers:{ Authorization:'Bearer '+await jetonDbx(), 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc({cursor:{session_id:sid, offset:off}, commit:arg}) }, body: blob.slice(off) });
  t = await r.text(); if (!r.ok) throw new Error('envoi (fin) : ' + t.slice(0,200)); prog && prog(blob.size - off); return JSON.parse(t);
}
async function importerDepuisDropbox(){
  try {
    const dossier = REG.dbxRacine.replace(/\/$/,'') + '/_A IMPORTER';
    const l = await dbxRPC('files/list_folder', {path: dossier});
    const js = l.entries.filter(e => e['.tag']==='file' && /\.json$/i.test(e.name));
    if (!js.length) return toast('Aucun dossier préparé dans « _A IMPORTER »', 4000);
    let n = 0;
    for (const e of js) {
      const r = await fetch('https://content.dropboxapi.com/2/files/download', { method:'POST', headers:{ Authorization:'Bearer '+await jetonDbx(), 'Dropbox-API-Arg': enc({path:e.path_lower}) } });
      if (!r.ok) continue; if (await importerJSON(await r.text(), true)) n++;
    }
    toast(`${n} dossier(s) importé(s)`); vueListe();
  } catch (e) { toast('Dropbox : ' + e.message, 5000); }
}

/* =================== Import d'un dossier préparé =================== */
async function importerJSON(txt, silencieux=false){
  try {
    const j = JSON.parse(txt); if (!j.dossier) throw new Error('format inconnu');
    const exist = (await dbAll('dossiers')).find(d => d.importId && d.importId === (j.dossier.importId || j.dossier.id));
    if (exist) { if (!silencieux) toast('Déjà importé : ' + (exist.client||'')); return false; }
    const d = Object.assign(nouveauDossier(), j.dossier, { id: uid(), importId: j.dossier.importId || j.dossier.id || uid(), envois: [], archive:false, maj:new Date().toISOString() });
    await dbPut('dossiers', d);
    let n = 0;
    for (const x of (j.ouvertures||[])) { n++; const o = Object.assign(nouvelleOuverture(d.id, x.num || n), x, { id: uid(), dossierId: d.id, statut:'en cours' });
      o.cintre = Object.assign(nouvelleOuverture().cintre, x.cintre||{}); o.criteres = Object.assign(nouvelleOuverture().criteres, x.criteres||{}); delete o.medias; delete o.controles; await dbPut('ouvertures', o); }
    if (!silencieux) { toast('Dossier importé'); aller('/d/' + d.id); }
    return true;
  } catch (e) { toast('Import impossible : ' + e.message, 4000); return false; }
}
$('#importFichier').onchange = async e => { const f = e.target.files[0]; if (f) await importerJSON(await f.text()); e.target.value=''; };

/* =================== Zip (export sans Dropbox) =================== */
const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function zip(files){ // [{name, blob}] — stockage sans compression
  const parts = [], cd = []; let off = 0; const te = new TextEncoder();
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()); const nm = te.encode(f.name); const crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true);
    parts.push(h.buffer, nm, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cd.push(c.buffer, nm); off += 30 + nm.length + data.length;
  }
  const cdLen = cd.reduce((a,b)=>a+(b.byteLength||b.length),0);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdLen,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cd, e.buffer], {type:'application/zip'});
}

  $('#titre').textContent = 'Envoyer — ' + (D.client||'dossier');

  const aTr = MEDIAS.filter(m => m.kind!=='photo' && m.transcrire).length;
  const taille = MEDIAS.reduce((a,m)=>a+(m.blob?.size||0),0);
  const nonEnv = MEDIAS.filter(m => !m.envoye);
  $('#app').innerHTML = `

    </ul>

  </div>
  <div class="carte">

    ${REG.dbxRefresh ? `<p class="muted">Dossier : ${esc(REG.dbxRacine)}/${esc(dossierEnvoi())}</p>
      ${navigator.onLine ? '' : '<p class="alertes"><li>Pas de réseau pour l’instant. Le dossier reste en sécurité sur le téléphone.</li></p>'}
      <button class="btn bleu plein" id="goDbx" ${navigator.onLine?'':'disabled'}>Envoyer dans Dropbox (${nonEnv.length} média(s) + fiche)</button>

  </div>
  <div class="carte">
    <h2>Sans Dropbox direct</h2>
    <button class="btn sec plein" id="goZip">Partager le dossier (.zip) : Dropbox, mail…</button>
  </div>
  ${D.envois.length ? `<div class="carte"><h2>Historique</h2>${D.envois.map(e=>`<div class="muted">${e.date.slice(0,16).replace('T',' ')} · ${esc(e.mode)} · ${esc(e.chemin||'')}</div>`).join('')}</div>` : ''}`;
  if ($('#goDbx')) $('#goDbx').onclick = envoyerDropbox;
  $('#goZip').onclick = partagerZip;
}
const dossierEnvoi = () => `${D.dateRdv||auj()}_${slug(D.client)}${D.test?'_TEST':''}`;
async function envoyerDropbox(){
  const btn = $('#goDbx'); btn.disabled = true;
  const pb = $('#pbar'), pm = $('#pmsg');
  try {
    const { json, md, noms } = construireExport();
    const base = REG.dbxRacine.replace(/\/$/,'') + '/' + dossierEnvoi();
    const aEnv = MEDIAS.filter(m => !m.envoye);
    const total = aEnv.reduce((a,m)=>a+m.blob.size,0) + 1; let fait = 0;
    const prog = n => { fait += n; pb.style.width = Math.min(100, fait/total*100).toFixed(1) + '%'; };
    for (const m of aEnv) {
      pm.textContent = 'Envoi ' + noms.get(m.id) + '…';
      const r = await dbxUpload(base + '/medias/' + noms.get(m.id), m.blob, prog);
      m.envoye = true; m.cheminDbx = r.path_display; await dbPut('medias', m);
    }
    const st = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').replace(/^(\d{8})(\d{4})$/,'$1-$2');
    json.medias_chemins = Object.fromEntries(MEDIAS.map(m => [noms.get(m.id), m.cheminDbx||'']));
    pm.textContent = 'Envoi de la fiche…';
    await dbxUpload(`${base}/RELEVE_${st}.json`, new Blob([JSON.stringify(json, null, 1)], {type:'application/json'}));
    await dbxUpload(`${base}/RELEVE_${st}.md`, new Blob([md], {type:'text/markdown'}));
    pb.style.width = '100%';
    D.envois.push({date:new Date().toISOString(), mode:'Dropbox', chemin: base}); await sauverMaintenant();
    pm.textContent = '✓ Envoyé. Dites à Claude : « relevé ' + (D.client||'') + ' déposé ».';
    toast('Envoyé dans Dropbox', 4000);
  } catch (e) { pm.textContent = '✕ ' + e.message + ' — rien n’est perdu, réessayez.'; btn.disabled = false; }
}
async function partagerZip(){
  try {
    toast('Préparation du zip…');
    const { json, md, noms } = construireExport();
    const files = [ {name:'RELEVE.json', blob:new Blob([JSON.stringify(json,null,1)])}, {name:'RELEVE.md', blob:new Blob([md])},
      ...MEDIAS.map(m => ({name:'medias/'+noms.get(m.id), blob:m.blob})) ];
    const z = await zip(files); const nom = dossierEnvoi() + '.zip';
    const f = new File([z], nom, {type:'application/zip'});
    if (navigator.canShare && navigator.canShare({files:[f]})) {
      await navigator.share({files:[f], title: nom});
    } else { const a = document.createElement('a'); a.href = URL.createObjectURL(z); a.download = nom; a.click(); }
    D.envois.push({date:new Date().toISOString(), mode:'Partage zip', chemin:nom}); await sauverMaintenant();
  } catch (e) { if (e.name !== 'AbortError') toast('Partage : ' + e.message, 4000); }
}

      const j = await r.json(); toast(r.ok ? '✓ IA opérationnelle' : 'IA : ' + (j.error?.message||r.status), 5000); } catch (e) { toast('IA : ' + e.message, 5000); } };
  if (navigator.storage?.estimate) navigator.storage.estimate().then(async e => {
    const p = navigator.storage.persisted ? await navigator.storage.persisted() : false;

/* =================== Réseau, démarrage =================== */
function majReseau(){ const r = $('#reseau'); r.textContent = navigator.onLine ? 'En ligne' : 'Hors ligne'; r.className = navigator.onLine ? 'on' : ''; }
window.addEventListener('online', () => { majReseau(); if (/^#\/(d|o|envoi)\//.test(location.hash)) rafraichir(); });
window.addEventListener('offline', majReseau);
(async function demarrer(){
  try {
    await ouvrirDB(); await chargerReglages(); majReseau();
    if (navigator.storage?.persist) navigator.storage.persist().catch(()=>{});
