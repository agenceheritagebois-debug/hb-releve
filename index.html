<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3a1e">
<title>HB Relevé</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{--bois:#5b3a1e;--bois2:#8a5a2b;--fond:#f6f1ea;--carte:#fff;--txt:#1d1a16;--gris:#6b645c;--ligne:#ddd3c6;--ok:#1f7a3a;--alerte:#b3261e;--ia:#c26a00;--bleu:#1f5f9e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--txt);font:17px/1.35 system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bois);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:transparent;border:0;color:#fff;font-size:22px;padding:4px 8px;min-width:40px}
#reseau{font-size:12px;padding:3px 8px;border-radius:10px;background:#3a2412}
#reseau.on{background:#2e7d32}
main{padding:12px;padding-bottom:130px;max-width:760px;margin:0 auto}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.carte h2{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--bois2);margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid #efe6da}
label.l{display:block;font-size:13px;font-weight:600;color:var(--gris);margin:14px 0 6px}
.coche{display:flex;gap:10px;align-items:center;font-size:16px;margin:14px 0 4px;color:var(--txt)}
.coche input{width:24px;height:24px;flex:none}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--ligne);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:70px;resize:vertical}
input.cote{font-size:28px;font-weight:700;text-align:center;letter-spacing:.03em;padding:8px}
.ia-flag{border-color:var(--ia)!important;box-shadow:0 0 0 2px #f5c58a}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.g4{display:grid;grid-template-columns:repeat(4,1fr)}
.chips.g3{display:grid;grid-template-columns:repeat(3,1fr)}
.chips.g2{display:grid;grid-template-columns:repeat(2,1fr)}
.chips.g4 .chip,.chips.g3 .chip,.chips.g2 .chip{padding:10px 4px;text-align:center}
.chip{border:1px solid var(--ligne);background:#fff;border-radius:10px;padding:10px 13px;font:inherit;font-size:15px;color:var(--txt);min-height:44px;line-height:1.15}
.chip.on{background:var(--bois);border-color:var(--bois);color:#fff}
.chip.ia{border-color:var(--ia);box-shadow:0 0 0 2px #f5c58a}
.ligne2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ligne3{display:grid;grid-template-columns:1fr;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:13px 16px;font:inherit;font-weight:600;background:var(--bois);color:#fff;min-height:48px}
.btn.sec{background:#efe6da;color:var(--bois)}
.btn.vert{background:var(--ok)}
.btn.rouge{background:var(--alerte)}
.btn.bleu{background:var(--bleu)}
.btn.ia{background:var(--ia)}
.btn.plein{width:100%}
.btn:disabled{opacity:.45}
.barre{display:flex;gap:8px;flex-wrap:wrap}
.barre .btn{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--ligne);border-radius:10px;background:#fff;margin-bottom:8px}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t small{color:var(--gris)}
.badge{font-size:12px;padding:3px 8px;border-radius:10px;background:#eee;white-space:nowrap}
.badge.ok{background:#d9f0df;color:var(--ok)}
.badge.enc{background:#fde7c8;color:#8a4b00}
.badge.env{background:#dbe8f7;color:var(--bleu)}
.alertes{margin:0;padding:0;list-style:none}
.alertes li{background:#fdecea;color:var(--alerte);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:15px}
.alertes li.info{background:#fff4e0;color:#8a4b00}
.medias{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.media{border:1px solid var(--ligne);border-radius:10px;overflow:hidden;background:#fff;font-size:14px}
.media img,.media video{width:100%;height:110px;object-fit:cover;display:block;background:#222}
.media audio{width:100%}
.media .c{padding:6px 8px}
.media label{display:flex;gap:6px;align-items:center}
.media input[type=checkbox]{width:22px;height:22px}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:var(--fond);border-top:1px solid var(--ligne);box-shadow:0 -4px 12px rgba(0,0,0,.06);display:flex;gap:8px;max-width:760px;margin:0 auto}
.fab .btn{flex:1;padding:12px 8px;font-size:15px}
details.pli{padding:0}
details.pli>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer}
details.pli>summary::-webkit-details-marker{display:none}
details.pli>summary .tt{flex:1;min-width:0}
details.pli>summary b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--bois2)}
details.pli>summary small{display:block;color:var(--gris);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.pli>summary::after{content:'▾';font-size:20px;color:var(--bois2);transition:transform .15s}
details.pli:not([open])>summary::after{transform:rotate(-90deg)}
details.pli>.contenu{padding:0 14px 14px;border-top:1px solid #efe6da}
details.pli .carte{border:0;padding:0;margin:0;box-shadow:none}
details.pli .carte h2{display:none}
.rec{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.muted{color:var(--gris);font-size:14px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:40;font-size:15px;max-width:90%;text-align:center}
details summary{cursor:pointer;font-weight:600;color:var(--bois2);padding:6px 0}
.prop{border:1px solid var(--ia);border-radius:10px;padding:10px;background:#fffaf2;margin-top:10px}
.prop label{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.prop input{width:22px;height:22px;flex:none}
.progress{height:10px;background:#eee;border-radius:6px;overflow:hidden}
.progress div{height:100%;background:var(--bleu);width:0}
.step{display:grid;grid-template-columns:110px 52px 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.step span{font-weight:600}
.step button{width:52px;height:52px;font-size:26px;border-radius:10px;border:1px solid var(--ligne);background:#fff;color:var(--txt)}
.step input{text-align:center;font-size:24px;font-weight:700;min-width:0;padding:8px}
.aide{color:var(--gris);font-size:13px;margin:6px 0 0}
/* appareil photo intégré */
#cam{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#cam video{flex:1;width:100%;object-fit:cover;min-height:0}
#cam .haut{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;padding-top:max(12px,env(safe-area-inset-top));color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent)}
#cam .haut button{background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:20px;padding:10px 16px;font:inherit;font-weight:600}
#cam .bas{display:flex;justify-content:space-around;align-items:center;padding:18px 10px;padding-bottom:max(18px,env(safe-area-inset-bottom));background:#000}
#cam .declic{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
#cam .rec{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#d32f2f;color:#fff;font-weight:700}
#cam .rec.on{border-radius:14px;animation:pulse 1s infinite}
#cam .lib{color:#fff;font-size:13px;text-align:center;width:70px}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .15s}
#cam .chrono{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#d32f2f;color:#fff;padding:4px 12px;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<header>
  <button id="retour" aria-label="Retour" hidden>←</button>
  <h1 id="titre">HB Relevé</h1>
  <span id="reseau">hors ligne</span>
  <button id="btnReglages" aria-label="Réglages">⚙</button>
</header>
<main id="app"></main>
<input type="file" id="capture" accept="image/*,video/*" capture="environment" hidden>
<input type="file" id="galerie" accept="image/*,video/*,audio/*" multiple hidden>
<input type="file" id="importFichier" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   HB Relevé — Héritage Bois — relevé de chantier hors ligne
   Version 0.1 (17/11/2026). Données stockées sur le téléphone (IndexedDB).
   ===================================================================== */
const VERSION = '0.4';
const FORMAT = 'hb-releve-1';

/* ---------- Listes (vocabulaire Térence, Synthèse § 2) ---------- */
const TYPES = ['OF1','OF2','OF3','OF4','PF1','PF2','PF3','Fixe','Porte 1V','Porte 2V','Volet 1V','Volet 2V','Volet 4V','Autre'];
const REFS = ['Hors-tout','Tableau','Dos de dormant'];
const NATURES = ['Fenêtres','Portes-fenêtres','Portes','Volets','Restauration'];
const GAMMES = ['Recouvrement 58','Affleurante 58, paumelles semi-encastrées','Affleurante 58, paumelles non encastrées','À définir'];
const FINITIONS = ['Pré-peinture blanche','Peinture de finition','Lasure','Brut','Variante'];
const ESSENCES = ['Chêne','Pin','Mélèze','Sapelli','Moabi','À définir'];
const VITRAGES = ['STD 4/18/4','44.2','SP10','Sans','À définir'];
const POSES = ['Fourniture + pose','Fourniture seule'];
const FIXES = ['Aucun','Gauche','Droite','Gauche + droite'];
const FORMES = ['Droite','Cintrée'];
const CINTRES = ['Surbaissé','Plein cintre','Anse de panier'];
const SENS_1V = ['Tirant gauche','Tirant droit'];
const SENS_2V = ['VP à droite','VP à gauche'];
const BAS = ['Pièce d’appui','Seuil alu'];

/* ---------- Petits outils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const auj = () => new Date().toISOString().slice(0,10);
const getP = (o,p) => p.split('.').reduce((a,k)=>a==null?a:a[k], o);
const setP = (o,p,v) => { const k=p.split('.'); let a=o; k.slice(0,-1).forEach(x=>{ if(a[x]==null||typeof a[x]!=='object') a[x]={}; a=a[x]; }); a[k[k.length-1]]=v; };
const slug = s => (s||'SANS NOM').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 _-]/g,'').trim().replace(/\s+/g,'_').toUpperCase().slice(0,40) || 'SANS_NOM';
function toast(m, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- Base locale (IndexedDB) ---------- */
let DB;
function ouvrirDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('hb-releve', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('dossiers', {keyPath:'id'});
      d.createObjectStore('ouvertures', {keyPath:'id'}).createIndex('dossierId','dossierId');
      d.createObjectStore('medias', {keyPath:'id'}).createIndex('dossierId','dossierId');
      d.createObjectStore('reglages', {keyPath:'k'});
    };
    r.onsuccess = () => { DB = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res, rej) => {
    const t = DB.transaction(store, mode); const s = t.objectStore(store);
    let out; const r = fn(s); if (r) r.onsuccess = () => out = r.result;
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const dbPut = (s, v) => tx(s, 'readwrite', st => st.put(v));
const dbGet = (s, k) => tx(s, 'readonly', st => st.get(k));
const dbDel = (s, k) => tx(s, 'readwrite', st => st.delete(k));
const dbAll = s => tx(s, 'readonly', st => st.getAll());
const dbParDossier = (s, id) => tx(s, 'readonly', st => st.index('dossierId').getAll(id));

/* Réglages (clés saisies par Térence lui-même, gardées sur le téléphone) */
const REG = { cleIA:'', modeleIA:'claude-sonnet-5-5', dbxAppKey:'', dbxRefresh:'', dbxAccess:'', dbxExpire:0, dbxRacine:'/_HERITAGE BOIS SAS/RELEVES APP' };
async function chargerReglages(){ const all = await dbAll('reglages'); all.forEach(r => REG[r.k] = r.v); }
async function reg(k, v){ REG[k] = v; await dbPut('reglages', {k, v}); }

/* ---------- Modèles ---------- */
function nouveauDossier(){
  return { id:uid(), format:FORMAT, cree:new Date().toISOString(), maj:new Date().toISOString(),
    client:'', adresse:'', tel:'', email:'', numero:'', dateRdv:auj(), nature:[], gamme:'', essence:'', finition:'', teinte:'RAL 9010',
    vitrage:'STD 4/18/4', pose:'Fourniture + pose', depose:'', notes:'', dictee:'', test:false, archive:false, envois:[], iaChamps:[] };
}
function nouvelleOuverture(dossierId, num){
  return { id:uid(), dossierId, num, repere:'', piece:'', type:'', fixes:'Aucun', imposte:false, forme:'Droite',
    cintre:{type:'', fleche:'', flecheRef:'', piedDroit:'', piedDroitRef:''},
    L:'', Lref:'', H:'', Href:'', grandJour:false, carH:'', carL:'', sens:'', soubassement:false, soubH:'', bas:'',
    criteres:{idem:true, gamme:'', essence:'', finition:'', vitrage:''},
    notes:'', dictee:'', statut:'en cours', iaChamps:[], maj:new Date().toISOString() };
}
const nbVantaux = t => { const m = /(\d)/.exec(t||''); if(m) return +m[1]; if(/^(Fixe)$/.test(t)) return 0; return 1; };

/* ---------- Contrôles de cohérence (alertent, ne bloquent jamais) ---------- */
function controles(o){
  const a = [];
  const L = +o.L, H = +o.H, t = o.type || '';
  if (!t) a.push(['err','Type d’ouvrage non choisi']);
  if (!o.L) a.push(['err','Largeur manquante']); else if (!o.Lref) a.push(['err','Largeur : choisir hors-tout, tableau ou dos de dormant']);
  if (!o.H) a.push(['err','Hauteur manquante']); else if (!o.Href) a.push(['err','Hauteur : choisir hors-tout, tableau ou dos de dormant']);
  if (o.L && (L < 150 || L > 5000)) a.push(['err',`Largeur ${L} mm : hors plage habituelle, vérifier (mm ?)`]);
  if (o.H && (H < 150 || H > 5000)) a.push(['err',`Hauteur ${H} mm : hors plage habituelle, vérifier (mm ?)`]);
  if (/^PF/.test(t) && H && H < 1800) a.push(['info',`PF de ${H} de haut : vérifier (fenêtre ?)`]);
  if (/^OF/.test(t) && H && H > 2300) a.push(['info',`OF de ${H} de haut : vérifier (porte-fenêtre ?)`]);
  if (/^(OF|PF)/.test(t) && L && H && L > H*1.8) a.push(['info','Largeur bien plus grande que la hauteur : cotes inversées ?']);
  if (/^(OF2|PF2)/.test(t) && L && L < 700) a.push(['info',`${t} de ${L} de large : vantaux très étroits, vérifier`]);
  if (o.forme === 'Cintrée') {
    if (!o.cintre.fleche) a.push(['err','Cintrée : flèche manquante']);
    else if (!o.cintre.flecheRef) a.push(['err','Flèche : préciser tableau ou hors-tout']);
    if (o.cintre.type === 'Plein cintre' && o.cintre.fleche && L && Math.abs(+o.cintre.fleche - L/2) > 30) a.push(['info','Plein cintre : flèche ≠ demi-largeur, vérifier']);
    if (o.cintre.fleche && H && +o.cintre.fleche >= H) a.push(['err','Flèche ≥ hauteur : impossible']);
  }
  if (/^(OF|PF|Porte|Fixe)/.test(t) && !o.grandJour && !o.carH && !o.carL) a.push(['info','Carreaux par vantail non renseignés (ou cocher Grand jour)']);
  if (o.soubassement) {
    if (!o.soubH) a.push(['err','Soubassement : hauteur manquante']);
    else if (H && +o.soubH >= H) a.push(['err','Soubassement ≥ hauteur : impossible']);
    else if (+o.soubH < 200 || (H && +o.soubH > H*0.7)) a.push(['info',`Soubassement ${o.soubH} mm : vérifier`]);
    if (!o.bas) a.push(['info','Soubassement : préciser pièce d’appui ou seuil alu']);
  }
  if (o.Lref && o.Href && o.Lref !== o.Href) a.push(['info',`Largeur en ${o.Lref.toLowerCase()}, hauteur en ${o.Href.toLowerCase()} : voulu ?`]);
  if (o.iaChamps && o.iaChamps.length) a.push(['info',`${o.iaChamps.length} case(s) remplie(s) par l’IA à vérifier (en orange)`]);
  return a;
}

/* ---------- État / navigation (le bouton retour Android marche) ---------- */
let D = null, O = null, OUVS = [], MEDIAS = [];
const URLS = new Map();
function urlMedia(m){ if(!URLS.has(m.id)) URLS.set(m.id, URL.createObjectURL(m.blob)); return URLS.get(m.id); }
function aller(h){ location.hash = h; }
window.addEventListener('hashchange', route);
async function route(){
  stopDictee(); stopMemo(true); fermerCamera(false);
  const h = location.hash.slice(1) || '/';
  const p = h.split('/').filter(Boolean);
  $('#retour').hidden = p.length === 0;
  if (p[0] === 'd' && p[1]) { await chargerDossier(p[1]); return vueDossier(); }
  if (p[0] === 'o' && p[1]) { O = await dbGet('ouvertures', p[1]); if(!O) return aller('/'); await chargerDossier(O.dossierId); return vueOuverture(); }
  if (p[0] === 'envoi' && p[1]) { await chargerDossier(p[1]); return vueEnvoi(); }
  if (p[0] === 'reglages') return vueReglages();
  return vueListe();
}
async function chargerDossier(id){
  D = await dbGet('dossiers', id);
  if(!D){ aller('/'); throw new Error('dossier introuvable'); }
  OUVS = (await dbParDossier('ouvertures', id)).sort((a,b)=>a.num-b.num);
  MEDIAS = (await dbParDossier('medias', id)).sort((a,b)=>a.date.localeCompare(b.date));
}
$('#retour').onclick = () => history.length > 1 ? history.back() : aller('/');
$('#btnReglages').onclick = () => aller('/reglages');

/* Sauvegarde automatique */
let tSave = null;
function sauver(){ clearTimeout(tSave); tSave = setTimeout(sauverMaintenant, 350); }
async function sauverMaintenant(){
  clearTimeout(tSave);
  if (D) { D.maj = new Date().toISOString(); await dbPut('dossiers', D); }
  if (O) { O.maj = new Date().toISOString(); await dbPut('ouvertures', O); }
}
window.addEventListener('pagehide', sauverMaintenant);
document.addEventListener('visibilitychange', () => { if (document.hidden) sauverMaintenant(); });

/* ---------- Composants ---------- */
function chips(path, options, cible, multi=false, grille=''){
  const v = getP(cible, path);
  const ia = (cible.iaChamps||[]).includes(path);
  return `<div class="chips ${grille}">${options.map(x => {
    const on = multi ? (v||[]).includes(x) : v === x;
    return `<button class="chip${on?' on':''}${on&&ia?' ia':''}" data-chip="${esc(path)}" data-v="${esc(x)}" data-multi="${multi?1:0}">${esc(x)}</button>`;
  }).join('')}</div>`;
}
function champ(path, cible, opts={}){
  const v = getP(cible, path) ?? '';
  const ia = (cible.iaChamps||[]).includes(path) ? ' ia-flag' : '';
  if (opts.zone) return `<textarea data-f="${path}" class="${ia}" placeholder="${esc(opts.ph||'')}">${esc(v)}</textarea>`;
  const num = opts.num ? ' inputmode="numeric" pattern="[0-9]*"' : '';
  return `<input data-f="${path}" class="${opts.cote?'cote':''}${ia}" value="${esc(v)}" placeholder="${esc(opts.ph||'')}"${num} type="${opts.type||'text'}" autocomplete="off">`;
}
function cible(el){ return el.closest('[data-cible="d"]') ? D : O; }

document.addEventListener('input', e => {
  const el = e.target; const p = el.dataset.f; if (!p) return;
  const c = cible(el); if (!c) return;
  let v = el.value;
  if (el.inputMode === 'numeric') { v = v.replace(/[^0-9]/g,''); if (v !== el.value) el.value = v; }
  setP(c, p, v);
  c.iaChamps = (c.iaChamps||[]).filter(x => x !== p); el.classList.remove('ia-flag');
  if (c === O && (p === 'carH' || p === 'carL') && v) { const autre = p === 'carH' ? 'carL' : 'carH'; if (!O[autre]) { O[autre] = '1'; const e2 = document.querySelector(`[data-f="${autre}"]`); if (e2) e2.value = '1'; } }
  if (c === O && O.statut === 'validée') { O.statut = 'modifiée'; }
  sauver();
  if (c === O && el.dataset.live) majControles();
});
document.addEventListener('click', e => {

/* Appareil photo intégré : s'ouvre directement, photo et vidéo dans le même écran */
let CAM = null;
async function ouvrirCamera(ouvertureId){
  mediaCible = ouvertureId;
  const repli = () => { $('#capture').setAttribute('accept','image/*'); $('#capture').value=''; $('#capture').click(); };
  if (!navigator.mediaDevices?.getUserMedia) return repli();
  let stream;
  const video = { facingMode:{ideal:'environment'}, width:{ideal:1920}, height:{ideal:1080} };
  try { stream = await navigator.mediaDevices.getUserMedia({ video, audio:true }); }
  catch (e) { try { stream = await navigator.mediaDevices.getUserMedia({ video }); } catch (e2) { toast('Appareil photo refusé : autorisez-le dans Chrome'); return repli(); } }
  const el = document.createElement('div'); el.id = 'cam';
  el.innerHTML = `<video autoplay playsinline muted></video><div class="flash"></div>
    <div class="haut"><button id="camFermer">✕ Fermer</button><span id="camNb"></span></div>
    <div class="bas"><div class="lib"><button class="rec" id="camRec" aria-label="Vidéo"></button><br>Vidéo</div>
      <div class="lib"><button class="declic" id="camPhoto" aria-label="Photo"></button><br>Photo</div>
      <div class="lib" style="width:70px"></div></div>`;
  document.body.appendChild(el);
  const v = el.querySelector('video'); v.srcObject = stream;
  CAM = { el, stream, n:0, rec:null, chunks:[], t0:0, timer:null };
  const nb = () => el.querySelector('#camNb').textContent = CAM.n ? `${CAM.n} enregistré(s)` : '';
  el.querySelector('#camFermer').onclick = () => fermerCamera(true);
  el.querySelector('#camPhoto').onclick = async () => {
    try {
      const track = stream.getVideoTracks()[0]; let blob = null;
      if ('ImageCapture' in window) { try { blob = await new ImageCapture(track).takePhoto(); } catch(_){} }

function construireExport(){

  const L = [];
  L.push(`# RELEVÉ — ${D.client||'(sans nom)'}${D.test?' — TEST':''}`, '', `- Date du RDV : ${D.dateRdv||'?'} · N° : ${D.numero||'—'}`, `- Adresse : ${D.adresse||'—'} · Tél : ${D.tel||'—'} · Mail : ${D.email||'—'}`,

    `- Vitrage : ${D.vitrage||'—'} · ${D.pose||'—'} · Dépose : ${D.depose||'—'}`);

  if (D.iaChamps?.length) L.push(`- ⚠ Cases dossier remplies par l’IA non vérifiées : ${D.iaChamps.join(', ')}`);
  OUVS.forEach(o => {
    L.push('', `## N°${o.num}${o.repere?' — '+o.repere:''} · ${o.type||'?'}${o.fixes&&o.fixes!=='Aucun'?' + fixe '+o.fixes.toLowerCase():''}${o.imposte?' + imposte':''}${o.forme==='Cintrée'?' · cintrée ('+(o.cintre.type||'?')+')':''} — ${o.statut.toUpperCase()}`);

    if (o.soubassement) L.push(`- Soubassement : ${o.soubH||'?'} mm, du bas de la menuiserie (dessous ${o.bas?o.bas.toLowerCase():'pièce d’appui / seuil ?'}) au dessus de la traverse intermédiaire (début du clair de vitrage)`);
    if (o.sens) L.push(`- Sens : ${o.sens}`);
    L.push(`- Critères : ${o.criteres.idem?'comme le dossier':[o.criteres.gamme,o.criteres.essence,o.criteres.finition,o.criteres.vitrage].filter(Boolean).join(' · ')}`);
    if (o.notes) L.push(`- Remarques : ${o.notes.replace(/\n/g,' / ')}`);

    const ms = MEDIAS.filter(m=>m.ouvertureId===o.id); if (ms.length) L.push(`- Médias : ${ms.map(m=>noms.get(m.id)).join(', ')}`);

const enc = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u' + ('000' + c.charCodeAt(0).toString(16)).slice(-4));
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
const redirectURI = () => location.origin + location.pathname;
async function connecterDropbox(){
  if (!REG.dbxAppKey) return toast('Saisir d’abord la clé d’application Dropbox');
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  lsSet('hb-pkce', v);
  location.href = `https://www.dropbox.com/oauth2/authorize?client_id=${encodeURIComponent(REG.dbxAppKey)}&response_type=code&code_challenge=${ch}&code_challenge_method=S256&token_access_type=offline&redirect_uri=${encodeURIComponent(redirectURI())}`;
}

    const j = await r.json(); if (!r.ok) throw new Error(j.error_description || j.error);
    await reg('dbxRefresh', j.refresh_token); await reg('dbxAccess', j.access_token); await reg('dbxExpire', Date.now() + (j.expires_in-60)*1000);
    toast('Dropbox connecté');
  } catch (e) { toast('Dropbox : ' + e.message, 5000); }
}
async function jetonDbx(){
  if (REG.dbxAccess && Date.now() < REG.dbxExpire) return REG.dbxAccess;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body: new URLSearchParams({ grant_type:'refresh_token', refresh_token: REG.dbxRefresh, client_id: REG.dbxAppKey }) });
  const j = await r.json(); if (!r.ok) throw new Error('reconnexion Dropbox nécessaire (' + (j.error_description||j.error) + ')');
  await reg('dbxAccess', j.access_token); await reg('dbxExpire', Date.now() + (j.expires_in-60)*1000); return j.access_token;
}
async function dbxRPC(route, arg){
  const r = await fetch('https://api.dropboxapi.com/2/' + route, { method:'POST', headers:{ Authorization:'Bearer ' + await jetonDbx(), 'Content-Type':'application/json' }, body: JSON.stringify(arg) });
  const t = await r.text(); if (!r.ok) throw new Error(route + ' : ' + t.slice(0,200)); return JSON.parse(t);
}
async function dbxUpload(path, blob, prog){
  const tok = await jetonDbx(); const CH = 8*1024*1024;
  const arg = { path, mode:'add', autorename:true, mute:true };
  if (blob.size <= CH) {
    const r = await fetch('https://content.dropboxapi.com/2/files/upload', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc(arg) }, body: blob });
    const t = await r.text(); if (!r.ok) throw new Error('envoi ' + path + ' : ' + t.slice(0,200)); prog && prog(blob.size); return JSON.parse(t);
  }
  let r = await fetch('https://content.dropboxapi.com/2/files/upload_session/start', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc({close:false}) }, body: blob.slice(0, CH) });
  let t = await r.text(); if (!r.ok) throw new Error('envoi (début) : ' + t.slice(0,200));
  const sid = JSON.parse(t).session_id; let off = CH; prog && prog(CH);
  while (blob.size - off > CH) {
    r = await fetch('https://content.dropboxapi.com/2/files/upload_session/append_v2', { method:'POST', headers:{ Authorization:'Bearer '+await jetonDbx(), 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc({cursor:{session_id:sid, offset:off}, close:false}) }, body: blob.slice(off, off+CH) });
    if (!r.ok) throw new Error('envoi (suite) : ' + (await r.text()).slice(0,200)); off += CH; prog && prog(CH);
  }
  r = await fetch('https://content.dropboxapi.com/2/files/upload_session/finish', { method:'POST', headers:{ Authorization:'Bearer '+await jetonDbx(), 'Content-Type':'application/octet-stream', 'Dropbox-API-Arg': enc({cursor:{session_id:sid, offset:off}, commit:arg}) }, body: blob.slice(off) });
  t = await r.text(); if (!r.ok) throw new Error('envoi (fin) : ' + t.slice(0,200)); prog && prog(blob.size - off); return JSON.parse(t);
}
async function importerDepuisDropbox(){
  try {
    const dossier = REG.dbxRacine.replace(/\/$/,'') + '/_A IMPORTER';
    const l = await dbxRPC('files/list_folder', {path: dossier});
    const js = l.entries.filter(e => e['.tag']==='file' && /\.json$/i.test(e.name));
    if (!js.length) return toast('Aucun dossier préparé dans « _A IMPORTER »', 4000);
    let n = 0;
    for (const e of js) {
      const r = await fetch('https://content.dropboxapi.com/2/files/download', { method:'POST', headers:{ Authorization:'Bearer '+await jetonDbx(), 'Dropbox-API-Arg': enc({path:e.path_lower}) } });
      if (!r.ok) continue; if (await importerJSON(await r.text(), true)) n++;
    }
    toast(`${n} dossier(s) importé(s)`); vueListe();
  } catch (e) { toast('Dropbox : ' + e.message, 5000); }
}

/* =================== Import d'un dossier préparé =================== */
async function importerJSON(txt, silencieux=false){
  try {
    const j = JSON.parse(txt); if (!j.dossier) throw new Error('format inconnu');
    const exist = (await dbAll('dossiers')).find(d => d.importId && d.importId === (j.dossier.importId || j.dossier.id));
    if (exist) { if (!silencieux) toast('Déjà importé : ' + (exist.client||'')); return false; }
    const d = Object.assign(nouveauDossier(), j.dossier, { id: uid(), importId: j.dossier.importId || j.dossier.id || uid(), envois: [], archive:false, maj:new Date().toISOString() });
    await dbPut('dossiers', d);
    let n = 0;
    for (const x of (j.ouvertures||[])) { n++; const o = Object.assign(nouvelleOuverture(d.id, x.num || n), x, { id: uid(), dossierId: d.id, statut:'en cours' });
      o.cintre = Object.assign(nouvelleOuverture().cintre, x.cintre||{}); o.criteres = Object.assign(nouvelleOuverture().criteres, x.criteres||{}); delete o.medias; delete o.controles; await dbPut('ouvertures', o); }
    if (!silencieux) { toast('Dossier importé'); aller('/d/' + d.id); }
    return true;
  } catch (e) { toast('Import impossible : ' + e.message, 4000); return false; }
}
$('#importFichier').onchange = async e => { const f = e.target.files[0]; if (f) await importerJSON(await f.text()); e.target.value=''; };

/* =================== Zip (export sans Dropbox) =================== */
const CRC = (() => { const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i=0;i<u8.length;i++) c = CRC[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function zip(files){ // [{name, blob}] — stockage sans compression
  const parts = [], cd = []; let off = 0; const te = new TextEncoder();
  for (const f of files) {
    const data = new Uint8Array(await f.blob.arrayBuffer()); const nm = te.encode(f.name); const crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true);
    parts.push(h.buffer, nm, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cd.push(c.buffer, nm); off += 30 + nm.length + data.length;
  }
  const cdLen = cd.reduce((a,b)=>a+(b.byteLength||b.length),0);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cdLen,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cd, e.buffer], {type:'application/zip'});
}

      <button class="btn bleu plein" id="goDbx" ${navigator.onLine?'':'disabled'}>Envoyer dans Dropbox (${nonEnv.length} média(s) + fiche)</button>

    <h2>Sans Dropbox direct</h2>

  </div>
  ${D.envois.length ? `<div class="carte"><h2>Historique</h2>${D.envois.map(e=>`<div class="muted">${e.date.slice(0,16).replace('T',' ')} · ${esc(e.mode)} · ${esc(e.chemin||'')}</div>`).join('')}</div>` : ''}`;
  if ($('#goDbx')) $('#goDbx').onclick = envoyerDropbox;
  $('#goZip').onclick = partagerZip;
}
const dossierEnvoi = () => `${D.dateRdv||auj()}_${slug(D.client)}${D.test?'_TEST':''}`;
async function envoyerDropbox(){
  const btn = $('#goDbx'); btn.disabled = true;
  const pb = $('#pbar'), pm = $('#pmsg');
  try {
    const { json, md, noms } = construireExport();
    const base = REG.dbxRacine.replace(/\/$/,'') + '/' + dossierEnvoi();
    const aEnv = MEDIAS.filter(m => !m.envoye);
    const total = aEnv.reduce((a,m)=>a+m.blob.size,0) + 1; let fait = 0;
    const prog = n => { fait += n; pb.style.width = Math.min(100, fait/total*100).toFixed(1) + '%'; };
    for (const m of aEnv) {
      pm.textContent = 'Envoi ' + noms.get(m.id) + '…';
      const r = await dbxUpload(base + '/medias/' + noms.get(m.id), m.blob, prog);
      m.envoye = true; m.cheminDbx = r.path_display; await dbPut('medias', m);
    }
    const st = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'').replace(/^(\d{8})(\d{4})$/,'$1-$2');
    json.medias_chemins = Object.fromEntries(MEDIAS.map(m => [noms.get(m.id), m.cheminDbx||'']));
    pm.textContent = 'Envoi de la fiche…';
    await dbxUpload(`${base}/RELEVE_${st}.json`, new Blob([JSON.stringify(json, null, 1)], {type:'application/json'}));
    await dbxUpload(`${base}/RELEVE_${st}.md`, new Blob([md], {type:'text/markdown'}));
    pb.style.width = '100%';
    D.envois.push({date:new Date().toISOString(), mode:'Dropbox', chemin: base}); await sauverMaintenant();
    pm.textContent = '✓ Envoyé. Dites à Claude : « relevé ' + (D.client||'') + ' déposé ».';
    toast('Envoyé dans Dropbox', 4000);
  } catch (e) { pm.textContent = '✕ ' + e.message + ' — rien n’est perdu, réessayez.'; btn.disabled = false; }
}
async function partagerZip(){
  try {
    toast('Préparation du zip…');
    const { json, md, noms } = construireExport();
    const files = [ {name:'RELEVE.json', blob:new Blob([JSON.stringify(json,null,1)])}, {name:'RELEVE.md', blob:new Blob([md])},
      ...MEDIAS.map(m => ({name:'medias/'+noms.get(m.id), blob:m.blob})) ];
    const z = await zip(files); const nom = dossierEnvoi() + '.zip';
    const f = new File([z], nom, {type:'application/zip'});
    if (navigator.canShare && navigator.canShare({files:[f]})) {
      await navigator.share({files:[f], title: nom});
    } else { const a = document.createElement('a'); a.href = URL.createObjectURL(z); a.download = nom; a.click(); }
    D.envois.push({date:new Date().toISOString(), mode:'Partage zip', chemin:nom}); await sauverMaintenant();
  } catch (e) { if (e.name !== 'AbortError') toast('Partage : ' + e.message, 4000); }
}

  if (navigator.storage?.estimate) navigator.storage.estimate().then(async e => {

  try {
    await ouvrirDB(); await chargerReglages(); majReseau();
